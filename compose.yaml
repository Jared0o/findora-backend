services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: findora
      POSTGRES_USER: findora
      POSTGRES_PASSWORD: findora_dev
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findora -d findora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
